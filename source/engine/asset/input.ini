; ---------------------------------------------------------------------------
; input.ini - DTEngine Input Action Bindings
;
; Format: action = key  (under [keyboard])
;         action = button  (under [gamepad])
;         action = axis    (under [gamepad_axis])
;         action = x, y, width, height  (under [touch], all normalized 0-1)
;
; Recognized key names:   A-Z, 0-9, Space, Escape/Esc, Enter/Return,
;                         Backspace, Tab, Shift/LShift/RShift,
;                         Ctrl/LCtrl/RCtrl, Alt/LAlt/RAlt,
;                         Up, Down, Left, Right, F1-F12
;
; Recognized gamepad buttons:  South/A/Cross, East/B/Circle,
;                               West/X/Square, North/Y/Triangle,
;                               Back/Select, Start, LB/L1, RB/R1,
;                               DPUp, DPDown, DPLeft, DPRight
;
; Recognized gamepad axes:     LeftStickX, LeftStickY,
;                               RightStickX, RightStickY,
;                               LeftTrigger/LT/L2, RightTrigger/RT/R2
; ---------------------------------------------------------------------------

[keyboard]
; Movement
MoveUp      = W
MoveDown    = S
MoveLeft    = A
MoveRight   = D

; Camera
CameraUp    = Up
CameraDown  = Down
CameraLeft  = Left
CameraRight = Right

; Actions
Interact    = E
Jump        = Space
Sprint      = LShift
Crouch      = LCtrl
Cancel      = Q

; UI / System
Pause       = Escape
Confirm     = Return
Inventory   = I
Map         = M
Journal     = J

; Debug / Engine (cannot be rebound in user config)
DebugToggle = F1
SpeedUp     = RShift

[gamepad]
; Movement (digital DPad - analog stick is in gamepad_axis)
MoveUp      = DPUp
MoveDown    = DPDown
MoveLeft    = DPLeft
MoveRight   = DPRight

; Actions
Interact    = South
Jump        = South
Sprint      = LeftShoulder
Crouch      = RightShoulder
Cancel      = East

; UI / System
Pause       = Start
Confirm     = South
Inventory   = North
Map         = Back

[gamepad_axis]
; Analog stick axes (mapped to named float axes, read via GetAxis())
MoveAxisX   = LeftStickX
MoveAxisY   = LeftStickY
CameraAxisX = RightStickX
CameraAxisY = RightStickY
ZoomAxis    = RightTrigger

[touch]
; Virtual control regions for mobile / touchscreen
; Format:  action = normX, normY, normWidth, normHeight  (0-1 screen coords)
; --- Left side: movement DPad ---
DPadUp      = 0.05, 0.52, 0.10, 0.13
DPadDown    = 0.05, 0.78, 0.10, 0.13
DPadLeft    = 0.02, 0.65, 0.10, 0.13
DPadRight   = 0.16, 0.65, 0.10, 0.13
; --- Right side: action buttons ---
Interact    = 0.84, 0.72, 0.10, 0.15
Jump        = 0.84, 0.55, 0.10, 0.15
Cancel      = 0.72, 0.64, 0.10, 0.15
Sprint      = 0.72, 0.80, 0.10, 0.13
; --- System ---
Pause       = 0.45, 0.02, 0.10, 0.07
